<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Math Practice</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="css/styles.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<div class="container">
  <header>
    <h1>SAT Math Practice</h1>
    <p class="subtitle">Practice the four Digital SAT Math domains with proper math rendering</p>
  </header>

  <div id="setup" class="panel">
    <h2>Choose Practice Mode</h2>
    <div class="domain-buttons">
      <button data-domain="algebra">Algebra</button>
      <button data-domain="advanced">Advanced Math</button>
      <button data-domain="psda">Problem-Solving & Data Analysis</button>
      <button data-domain="geometry">Geometry & Trigonometry</button>
      <button data-domain="mixed" class="primary">Mixed (All Domains)</button>
    </div>
    <div class="options">
      <label>Number of questions:
        <select id="qcount">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="30">30</option>
          <option value="50">50</option>
        </select>
      </label>
    </div>
    <button id="start-btn" class="primary large">Start Practice</button>
    <p class="note">Questions are randomly selected. Your progress is saved in this browser.</p>
  </div>

  <div id="practice" class="panel hidden">
    <div class="progress-bar">
      <span id="progress-text">Question 1 of 20</span>
      <div class="bar"><div id="bar-fill"></div></div>
    </div>
    <div class="meta">
      <span id="domain-badge" class="badge"></span>
      <span id="topic-badge" class="badge secondary"></span>
    </div>
    <div id="question" class="question"></div>
    <div id="choices" class="choices"></div>
    <div id="spr-input" class="spr hidden">
      <label>Your answer:
        <input type="text" id="spr-answer" placeholder="Enter number or fraction" autocomplete="off">
      </label>
      <button id="submit-spr">Submit</button>
    </div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="nav">
      <button id="next-btn" class="primary" disabled>Next Question</button>
      <button id="end-btn">End Session</button>
    </div>
  </div>

  <div id="results" class="panel hidden">
    <h2>Session Complete</h2>
    <div id="score-summary"></div>
    <button id="restart-btn" class="primary large">Practice Again</button>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
